<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XrenBeats Team - Official Roster</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #080808;
            --surface: #111111;
            --surface-2: #1a1a1a;
            --border: rgba(255,255,255,.07);
            --white: #f5f5f5;
            --muted: #888888;
            --accent: #c8ff00;
            --banned: #555555;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: var(--black);
            color: var(--white);
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            opacity: .03;
            pointer-events: none;
            z-index: 9999;
        }

        main {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 7rem 2.5rem 4rem;
            flex: 1;
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: .65rem;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 1rem;
        }

        h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(4.5rem, 11vw, 9rem);
            line-height: .9;
            font-weight: 400;
            letter-spacing: .02em;
            text-transform: uppercase;
        }

        h1 span {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--white);
        }

        .subtitle {
            margin: 1.5rem 0 0;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            width: 100%;
            margin-top: 4rem;
        }

        .member-card {
            min-height: 210px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: border-color .25s, transform .25s, background .25s;
            text-decoration: none;
            color: inherit;
        }

        .member-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .35s;
        }

        .member-card:hover {
            transform: translateY(-4px);
            border-color: rgba(200,255,0,.35);
            background: var(--surface-2);
        }

        .member-card:hover::before { transform: scaleX(1); }

        .member-card h3 {
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 400;
            line-height: 1;
            color: var(--white);
        }

        .status {
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: .58rem;
            line-height: 1.6;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .status::before {
            content: '●';
            color: var(--accent);
            margin-right: .55rem;
        }

        .member-card.banned {
            filter: grayscale(1);
            opacity: .6;
        }

        .member-card.banned::before { background: #ff4444; }

        .member-card.banned:hover {
            border-color: rgba(255,68,68,.5);
        }

        .banned-text {
            color: #ff4444;
            font-weight: bold;
        }

        .banned-text::before {
            content: '●';
            color: #ff4444;
            margin-right: .55rem;
        }

        .footer {
            width: 100%;
            margin-top: 6rem;
            border-top: 1px solid var(--border);
            color: #444;
            font-family: var(--font-mono);
            font-size: .65rem;
            text-align: center;
            padding: 2.5rem 1.25rem;
        }

        @media (max-width: 768px) {
            main { padding: 5.5rem 1.25rem 3rem; }
            .team-grid { grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-top: 3rem; }
            .member-card { min-height: 180px; padding: 1.25rem; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 4.5rem; }
            .team-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <main>
        <p class="section-label">// The Collective</p>
        <h1>The <span>Team</span></h1>
        <p class="subtitle">Official XrenBeats Roster</p>

        <div class="team-grid">
            <!-- Main Team -->
            <a href="/team/xcambeats.html" class="member-card">
                <h3>XCamBeats</h3>
                <div class="status">Active Member</div>
            </a>

            <a href="/team/plsdonthackme.html" class="member-card">
                <h3>plsdonthackme</h3>
                <div class="status">Active Member</div>
            </a>

            <a href="/team/fallen-ashes.html" class="member-card">
                <h3>Fallen Ashes</h3>
                <div class="status">Active Member</div>
            </a>

            <a href="/team/coly-good.html" class="member-card">
                <h3>Coly Good</h3>
                <div class="status">Active Member</div>
            </a>

            <a href="/team/xrenbruh" class="member-card">
                <h3>XrenBruh</h3>
                <div class="status">Active Member</div>
            </a>

            <a href="/team/lili" class="member-card">
                <h3>LILI!</h3>
                <div class="status">Active Member - Lead Singer</div>
            </a>

            <!-- Others -->
            <a href="/team/the-error.html" class="member-card">
                <h3>The Error</h3>
                <div class="status">Left Team</div>
            </a>

            <a href="/team/9liscx.html" class="member-card banned">
                <h3>9liscx</h3>
                <div class="status banned-text">Banned</div>
            </a>
        </div>
    </main>

    <div class="footer">XrenBeats | Full Archive</div>

</body>
</html>
